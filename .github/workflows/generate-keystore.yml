name: Generera signeringsnyckel (engångskörning)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generera ny keystore
        run: |
          # Slumpa lösenord (du behöver inte minnas dem — de lagras som secrets)
          KEYSTORE_PASS=$(openssl rand -base64 24 | tr -d '/+=')
          KEY_PASS=$(openssl rand -base64 24 | tr -d '/+=')
          KEY_ALIAS=vagnkoll

          keytool -genkeypair \
            -keystore vagnkoll-release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Vagnkoll, OU=Personal, O=sm5tog, L=., S=., C=SE"

          # Base64-koda keystoren så den kan lagras som secret
          base64 -w 0 vagnkoll-release.jks > vagnkoll-release.jks.base64

          # Skapa en text-fil med allt du behöver kopiera in
          cat > GITHUB-SECRETS-ATT-LÄGGA-TILL.txt <<EOF
          Lägg till följande som GitHub Secrets:
          https://github.com/sm5tog/vagnkoll/settings/secrets/actions

          1. KEYSTORE_BASE64
             (Klistra in HELA innehållet av vagnkoll-release.jks.base64
              — det är en lång rad utan radbrytningar.)

          2. KEYSTORE_PASSWORD
             ${KEYSTORE_PASS}

          3. KEY_ALIAS
             ${KEY_ALIAS}

          4. KEY_PASSWORD
             ${KEY_PASS}

          När alla fyra är tillagda, ta bort denna körnings artefakt
          (3 prickar → Delete) så att inga lösenord ligger kvar publikt.
          EOF

          ls -la

      - name: Ladda upp keystore + instruktioner
        uses: actions/upload-artifact@v4
        with:
          name: VIKTIGT-ladda-ner-och-läs
          path: |
            vagnkoll-release.jks.base64
            GITHUB-SECRETS-ATT-LÄGGA-TILL.txt
          retention-days: 1
